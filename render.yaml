services:
  - type: web
    name: sentinel-workforce-risk
    env: python
    buildCommand: "pip install -e . && cd frontend && npm install && npm run build && cd .."
    startCommand: "python scripts/serve.py"
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: NODE_VERSION
        value: "20.12.0"
      - key: ENVIRONMENT
        value: "production"
      - key: ARTIFACTS_DIR
        value: "artifacts"
      - key: HF_MODEL_REPO_ID
        value: "ParminderzHuggingFace/sentinel-workforce-risk-models"
